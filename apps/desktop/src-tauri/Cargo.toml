[package]
name = "raw-photo-converter-desktop"
version = "0.1.0"
edition = "2024"

# Distinct lib name avoids Windows PDB collision with the bin target
# (hyphens and underscores normalize to the same .pdb filename).
[lib]
name = "raw_photo_converter_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
base64 = "0.22"
raw-photo-converter-core = { path = "../../../crates/core" }
serde = { version = "1", features = ["derive"] }
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-notification = "2"
